[package]
name = "shardvault-rs"
version = "0.1.0"
edition = "2021"
authors = ["Antigravity Engineering"]
description = "Ultra-Fast, Self-Healing, Hardware-Bound Multi-Shard SQLite Engine for Resilient Edge, Desktop, and Server Applications"
license = "MIT OR Apache-2.0"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
aes-gcm = "0.10"
hmac = "0.12"
pbkdf2 = "0.12"
getrandom = "0.2"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }

[dev-dependencies]
tempfile = "3.8"

[[bin]]
name = "shardvault-studio"
path = "src/bin/studio.rs"
